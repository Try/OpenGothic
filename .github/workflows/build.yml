name: Build

env:
  VK_SDK:       '1.4.357.0'
  BUILD_TYPE:   RelWithDebInfo
  BUILD_OFFSET: 3623  # continue from AppVeyor build numbers

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - id: version
        run: |
          echo "version=OpenGothic v1.0.$((GITHUB_RUN_NUMBER + BUILD_OFFSET))" >> $GITHUB_OUTPUT
          echo "semver=1.0.$((GITHUB_RUN_NUMBER + BUILD_OFFSET))" >> $GITHUB_OUTPUT

  linux:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-vulkan
        with:
          os: Linux
          vk-sdk: ${{ env.VK_SDK }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libasound2-dev libx11-dev libxcursor-dev

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = \"${{ needs.setup.outputs.version }}\";" >> game/build.h
          mkdir -p build/opengothic
          echo 'gothic-linux-v${{ needs.setup.outputs.semver }}' >> build/opengothic/VERSION

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --target Gothic2Notr Spacer -j $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengothic_${{ needs.setup.outputs.semver }}_linux_x64
          path: build/opengothic/Gothic2Notr

  linux-deb:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-vulkan
        with:
          os: Linux
          vk-sdk: ${{ env.VK_SDK }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper cmake g++ \
            glslang-tools libasound2-dev libx11-dev libxcursor-dev

      - name: Setup ./debian
        run: |
          ln -s linux/debian debian

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = \"${{ needs.setup.outputs.version }}\";" >> game/build.h
          dch -v "${{ needs.setup.outputs.semver }}" -D unstable -M "Automated build"

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../opengothic_*.deb opengothic_${{ needs.setup.outputs.semver }}_linux_x64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengothic_${{ needs.setup.outputs.semver }}_linux_x64.deb
          path: opengothic_${{ needs.setup.outputs.semver }}_linux_x64.deb

  android-arm64:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - uses: ./.github/actions/setup-vulkan
        with:
          os: Linux
          vk-sdk: ${{ env.VK_SDK }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = \"${{ needs.setup.outputs.version }}\";" >> game/build.h

      - name: Configure
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build APK
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build/android --target OpenGothic-apk

  windows:
    needs: setup
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-vulkan
        with:
          os: Windows
          vk-sdk: ${{ env.VK_SDK }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glslang

      - name: Generate build version
        shell: pwsh
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = `"${{ needs.setup.outputs.version }}`";" >> game/build.h
          mkdir -p build/opengothic
          echo 'gothic-win64-v${{ needs.setup.outputs.semver }}' >> build/opengothic/VERSION

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --target Gothic2Notr Spacer

      - name: Copy runtime DLLs
        run: |
          cp "$MINGW_PREFIX/bin/libgcc_s_seh-1.dll" build/opengothic/
          cp "$MINGW_PREFIX/bin/libstdc++-6.dll" build/opengothic/
          cp "$MINGW_PREFIX/bin/libwinpthread-1.dll" build/opengothic/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengothic_${{ needs.setup.outputs.semver }}_win_x64
          path: |
            build/opengothic/*.exe
            build/opengothic/*.dll
            build/opengothic/*.bat

  macos-arm64:
    needs: setup
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install glslang

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = \"${{ needs.setup.outputs.version }}\";" >> game/build.h
          mkdir -p build/opengothic
          echo 'gothic-osx-arm64-v${{ needs.setup.outputs.semver }}' >> build/opengothic/VERSION

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --target Gothic2Notr Spacer -j $(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengothic_${{ needs.setup.outputs.semver }}_osx_arm64
          path: |
            build/opengothic/*

  macos-x64:
    needs: setup
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install glslang

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo "static const char* appBuild = \"${{ needs.setup.outputs.version }}\";" >> game/build.h
          mkdir -p build/opengothic
          echo 'gothic-osx-x64-v${{ needs.setup.outputs.semver }}' >> build/opengothic/VERSION

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --target Gothic2Notr Spacer -j $(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengothic_${{ needs.setup.outputs.semver }}_osx_x64
          path: |
            build/opengothic/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [setup, linux, linux-deb, windows, macos-arm64, macos-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        env:
          VERSION: ${{ needs.setup.outputs.semver }}
        run: |
          cd artifacts/opengothic_${VERSION}_linux_x64 && zip -r ../opengothic_${VERSION}_linux_x64.zip . && cd ../..
          cd artifacts/opengothic_${VERSION}_win_x64 && zip -r ../opengothic_${VERSION}_win_x64.zip . && cd ../..
          cd artifacts/opengothic_${VERSION}_osx_arm64 && zip -r ../opengothic_${VERSION}_osx_arm64.zip . && cd ../..
          cd artifacts/opengothic_${VERSION}_osx_x64 && zip -r ../opengothic_${VERSION}_osx_x64.zip . && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            artifacts/opengothic_${{ needs.setup.outputs.semver }}_linux_x64.zip
            artifacts/opengothic_${{ needs.setup.outputs.semver }}_linux_x64.deb/opengothic_${{ needs.setup.outputs.semver }}_linux_x64.deb
            artifacts/opengothic_${{ needs.setup.outputs.semver }}_win_x64.zip
            artifacts/opengothic_${{ needs.setup.outputs.semver }}_osx_arm64.zip
            artifacts/opengothic_${{ needs.setup.outputs.semver }}_osx_x64.zip
